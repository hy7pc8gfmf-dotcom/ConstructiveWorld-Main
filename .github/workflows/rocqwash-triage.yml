# rocqwash-triage.yml - furnace red triage watch via the local rocqwash MCP
# server (companion driver: .github/scripts/rocqwash_triage.py, 20261114).
#
# Design notes:
#   * Observer, not furnace: triggers on workflow_run of "Main CI 9.3" and
#     only acts when that furnace run concluded failure. The furnace yml is
#     not touched by this watch lane (zero edit to the certification core).
#   * The runner is the desk machine, so the job reaches the resident
#     rocqwash MCP server directly (stdio spawn, same wiring as the
#     user-level MCP config) and mirrors the triage report into the desk
#     inbox directory on this machine.
#   * Test mode: workflow_dispatch with a run_id input triages any given
#     historical run (no compile, read-only API face, netrc token masked
#     in the report).
#   * A red triage verdict is data, not a tool failure: the job stays green
#     as long as the watch leg itself works. A non-zero driver exit means
#     the watch leg is broken (server wiring, protocol, netrc, HTTP) and
#     the job shows red - fail loud, the desk must see the watch die.
#   * Heal leg (20261114 v2): for rerun-safe transient families only
#     (netred / runner-lost, i.e. verdict action "rerun-after-stable-window"),
#     the driver fast-forwards the bridge mirror main (guarded: clean tree,
#     strictly ff, budget-capped 1 round per run) and re-dispatches the
#     failed jobs. Content reds and toolchain breaks stay human-gated.
#   * Rollback: delete this file (and optionally the driver script); the
#     ledger entries already written stay valid history.
name: rocqwash triage watch

on:
  workflow_run:
    workflows: ["Main CI 9.3"]
    types: [completed]
  schedule:
    # reconcile pass: revive recently cancelled furnace runs (backfill to
    # green), budget-capped; cheap API scan, no compile.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'CI run id to triage (test mode; empty = reconcile only)'
        required: false
        default: ''
        type: string

permissions:
  actions: write
  contents: write

jobs:
  triage:
    runs-on: [self-hosted, Windows]
    steps:
      - name: Guard (triage only red furnace runs, dispatch test, or schedule)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            CONCL="${{ github.event.workflow_run.conclusion }}"
            echo "watch: Main CI 9.3 run $RUN_ID concluded $CONCL"
            if [ "$CONCL" = "failure" ]; then
              echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "HEAD_BRANCH=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_ENV"
              echo "HEAD_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
            fi
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "watch: scheduled reconcile pass"
            echo "RECONCILE=1" >> "$GITHUB_ENV"
          else
            if [ -n "${{ inputs.run_id }}" ]; then
              echo "watch: dispatch test mode, run ${{ inputs.run_id }}"
              echo "RUN_ID=${{ inputs.run_id }}" >> "$GITHUB_ENV"
            else
              echo "watch: dispatch without run_id - reconcile only"
              echo "RECONCILE=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Check out triage driver (main)
        if: env.RUN_ID != ''
        uses: actions/checkout@v5
        with:
          ref: main
          # NO sparse-checkout here on purpose: this runner shares one
          # cached checkout repo across all workflows, and a sparse pattern
          # left enabled there silently collapses every later job's working
          # tree to that pattern (20261114 #69 att2/att3 - furnace gates
          # died on a missing scripts/gates). Full checkout only.

      - name: Reconcile pass (scheduled backlog recovery)
        if: env.RECONCILE == '1'
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rocqwash-triage"
          "/c/Program Files/Python313/python.exe" .github/scripts/rocqwash_triage.py \
            --repo "${{ github.repository }}" \
            --run 0 \
            --out "$GITHUB_WORKSPACE/rocqwash-triage" \
            --inbox "D:/ComplexAnalysis/attn/_rocqwash_watch_inbox" \
            --state-dir "D:/ComplexAnalysis/attn/_rocqwash_watch_inbox" \
            --reconcile

      - name: Triage red run via local rocqwash MCP
        if: env.RUN_ID != ''
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/rocqwash-triage"
          "/c/Program Files/Python313/python.exe" .github/scripts/rocqwash_triage.py \
            --repo "${{ github.repository }}" \
            --run "$RUN_ID" \
            --out "$GITHUB_WORKSPACE/rocqwash-triage" \
            --inbox "D:/ComplexAnalysis/attn/_rocqwash_watch_inbox" \
            --state-dir "D:/ComplexAnalysis/attn/_rocqwash_watch_inbox" \
            --heal \
            --autofix \
            --mirror "D:/ComplexAnalysis/ConstructiveWorld-Main" \
            --head-branch "$HEAD_BRANCH" \
            --head-sha "$HEAD_SHA"

      - name: Upload triage artifacts
        if: env.RUN_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: rocqwash-triage-run-${{ env.RUN_ID }}
          path: rocqwash-triage/
          if-no-files-found: error
