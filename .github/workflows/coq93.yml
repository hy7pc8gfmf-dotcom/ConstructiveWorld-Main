#     「sha256」与 gate5_vodep_quarantine.py:220 [0-9a-f]{32} 硬闸冲突·按脚本契约裁定·gaps 登记）。
#   ⑤ attest 增量继承现役（20261108 admit 恢复）：过渡件（ATT-MODE-OVERRIDE 块＋CHK_SKIP_FILE
#     全树行＋skip 清空行）已退役删除——档案已按 #9 绿树重铸（e0dacd49·1021 件）；W3 backstop
#     （每 20 轮全量）保留。
#   ⑥ seed=main93 沙箱 BUILD_DONE 闸（seedLedger 判定 20261105=不可用：_93m_BUILD_DONE 缺席＋
#     1013/1018 .vo 缺 5 件·炉在飞）→ 首炉冷编零 seed·禁播 9.1 .vo（魔数 90100 vs 90300 拒载律）；
#     沙箱收官（R4 闸线）后播种自动启用。
#   ⑦ CHK_JOBS=14（用户令 20261105）＋CHK_TREE_COPY=1＋PCHK_BC_ARGS 照抄（脚本内置
#     parallel_chk.sh:344="-bytecode-compiler yes"·yml 无需带）＋RAM guard/TL98 backstop 保留；
#     guard 无 -CoreN 钉（底本 20261019 set1557 已去钉·本席 grep 实证）·mac 观察席 omit（Main
#     底本无 mac job 块·如实登记）。
# 摘雷（偏离底本·gaps 响亮登记）：底本 L384 悬空行 `pwsh … cpu_guard_v3.ps1 -Command`（无值）
#     本席实测 rc=1「参数 'Command' 缺少自变量」——bash -e 下必杀 coqchk 步（parallel_chk 永不
#     启动）；系底本 20261105 编辑残留。本炉摘除该行；底本零触碰（9.1 炉该行归底本所有者处置）。
# ═══════════════════════════════════════════════════════════════════════════
name: Main CI 9.3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos_only:
        description: 'Run macOS observation job only (skip Windows cert job)'
        type: boolean
        default: false

concurrency:
  # 20261105 换基（改点②）：与 9.1 炉组 cw-main-ci 隔离——双炉互不取消；组内 cancel-in-progress 仅及本组。
  group: cw-main-ci-93
  # 20261114 user order: queue, never cancel - a later push must not
  # take an in-flight furnace down; runs drain serially in order.
  cancel-in-progress: false

jobs:
  # ── Windows 认证 job（9.3 炉·与 9.1 炉 coq.yml 并存；认证语义同构·改点详见文件头注）────────
  coq-build:
    # 显示残留（ci_switch 包 §6 残留1 同款·不判红）：job name 仍书 9.1——甄别一律按 workflow 名
    # Main CI 9.3（守望甄别键=workflow 名·非 job 名）。
    name: Rocq 9.3 build + coqchk (self-hosted seed cache, Windows)  # display rename per user order 20261106
    # 20261026 mac-side pilot lane: workflow_dispatch with macos_only=true
    # skips the Windows cert job so mac-side revisions can be validated
    # without occupying the Windows self-hosted runner. Push/PR unchanged.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_only != true }}
    runs-on: [self-hosted, Windows]
    # 20261025 tau 十七片落装：无壳 hb 实件 128 条内核复算实证 ~10min/枚（KB22 沙箱双跑
    # 10h15m/2 道·主仓 R5 同款 4 组实测预测 10-12h）——480min 墙对首验 tau 闭包确定性不足，
    # 提至 960（与落装同波捎带·KB6 地雷二合规·本注记即实测依据）。
    # 20261105 keeper4 令（用户 20261105·三补丁②）：960→2880（48h 重尾冷编墙）——
    # run 41914865932 实证 9.3 冷编 960min 墙杀死循环结构解（build 步 stdout 21:42:58Z
    # 静默后 job 13:08:45Z 判 failure·全窗无 verdict）；48h=960 的 3 倍余量·
    # 卡死判据不靠墙（CPU 采样 10s 零增量另判）·墙只兜尾。
    timeout-minutes: 2880
    env:
      # ── 形 A 工具链注入（20261105 换基·七组改点③）──────────────────────────────
      # opam-root 9.3（本席实勘 coqc.exe/coqchk.exe/rocq.exe -v 三件双 9.3.0·20261105）。
      # 消费位：build.sh L4 `C="${COQC:-…9.1…}"`·parallel_chk.sh L57 `K="${COQCHK:-…9.1…}"`
      # （SW2 同根推导 COQLIB/ROCQLIB/ROCQDEP 全自 K 出）·gate5 CONTROL_BASES 读 COQLIB/
      # ROCQLIB（gate5 步另显式 --control 指 9.3 对照件）。unset 路径不存在（job env 恒注入）；
      # 回滚=删本 env 块＋改回底本形（底本原件未动·git 历史可 revert）。
      # 【cmdLedger 裁定 20261105】D:/actions-runner/cw_build.cmd L3 `set "COQC=…9.1…"` 硬编
      # 不吃 env（env 透传被覆写实测）→ build 步直调 build.sh（见 build 步内注·gaps 登记）。
      COQC: D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqc.exe
      COQCHK: D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqchk.exe
      COQLIB: D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/lib/coq
      ROCQLIB: D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/lib/coq
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      # ── AX-FORTRESS 防线挂点（20260925 施工单，R131 落树）────────────────────
      # 闸① 毒 token 守卫：pre-build fail-fast，秒级。exit 0 洁净／1 命中／2 树无效——
      # bash -e 下非零即 step 红且后续步不启（禁红后继续）。gate1 系扁平扫描（非递归）。
      # 【R131 落树席偏离登记，候翻案】施工单原案三树（含 CW219_split），现测
      # CW219_split 在册 5×Psatz（S11-S15 壳线，09-08 分裂波遗存，HEAD 在册、零脏态），
      # 系 CW_219 消融波候 GO 施工面且不在 CI build/coqchk 认证面（cw_build/cw_chk
      # 均 cd ConstructiveWorld_vo）——硬闸常咬已知有主面=哨兵信号归零，故本波
      # gate1 只扫 Live+vo（恰=云端认证面+世系对称面）；升级方向：消融波断根后
      # CW219_split 回补第三 --tree。本地预验：Live 679/vo 700 均 0 命中。
      - name: gate1 poison-token guard (pre-build fail-fast)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate1_poison_guard.py \
            --tree ConstructiveWorld_Live --tree ConstructiveWorld_vo \
            --json gate1_ci.json --text

      # gate8 vacuity sentinel (compile-must-fail probes): runs
      # scripts/gates/vacuity_sentinel/run_vacuity_sentinel.sh, which compiles
      # the three corrected-form refutation probes and asserts that each of
      # them FAILS to compile.  A probe that compiles means the premise
      # interface has become jointly unsatisfiable - RED.  Failure is the
      # normal state of this gate (see the script header); rc=1 is the only
      # red exit here, every other rc value stays green.
      - name: gate8 vacuity sentinel (compile-must-fail probes)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          bash scripts/gates/vacuity_sentinel/run_vacuity_sentinel.sh
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE8-RED: vacuity sentinel alarmed - see probe output above"
            exit 1
          else
            echo "gate8 step done rc=$rc (0 = green or indeterminate)"
          fi

      # 闸④ 注释哨兵（comment hygiene hard-gate，R135 落树）：gate1 后顺位——
      # 注释面先于公理面红闸（GATE4-EXT 草案口径）。gate4_comment_guard.py v2.0：
      # 头注五字段＋基座 65 禁词＋扩展五族共 130 扫描单元＋三域全量（文件头注/
      # 证明体内/子结构头注）＋判定原则启发式（--no-principle 可作降噪开关，CI 默认开）。
      # exit 0=PASS 绿；1=硬违规红屏（五字段缺/词面硬命中/承认式/席次战役/日期戳——
      # bash -e 下同 gate1 教义，非零红且后续步不启，禁红后继续）；2=黄级（仅原则
      # 启发式复核项/语境双义词如「载体」）——artifact 收编不红屏，人工复核清单
      # 随 gate4_report.json 出。双树口径与 gate1 同款；升级方向：CW219_split
      # 消融波断根后回补第三 --tree。
      # 【CI-ARTIFACT-FIX 20260926 事实登记】report 先写后判：脚本在 exit 码裁决前
      # 无条件落 gate4_report.json（v2.0/v2.1 同序，红/黄/绿三态均留证）。实证：
      # run 36156662359(红) 与 36152669096 a1(红)/a2(取消) 三包内均含
      # gate4_report.json+gate1_ci.json——红态 artifact 面可用，gate4 权威数以
      # coqchk-logs 包内 report 为准，run log 扫描行降为旁证。
      # 【--tree-recursive 裁决 20260926】默认关（守 1227 口径连续性，R135 1281→
      # R134 1245→LATEST 1227 对照链不破）；v2.1 脚本随下一波认证合流入库后，
      # 候探针件族归册/清偿 commit 落树再原子开启（vo 树 +22 盲区面如实入红账，
      # 红只增不减，禁降档）。
      - name: gate4 comment guard (pre-build, exit1=red exit2=yellow artifact-only)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          python scripts/gates/gate4_comment_guard.py \
            --tree ConstructiveWorld_Live --tree ConstructiveWorld_vo \
            --json gate4_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE4-RED: comment-guard hard violations — see gate4_report.json artifact"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE4-YELLOW: review-only findings — artifact-collected, not red"
            exit 0
          elif [ "$rc" -eq 0 ]; then
            echo "GATE4-GREEN: all comment checks passed"
          else
            echo "GATE4-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      # 闸③ 跨树 Require 毒面对称检查（E957 暗雷族／世系倒灌）。秒级，常开。
      # SINGLE-TREE-POISON exit 1=红；REQUIRE-DRIFT 仅登记 exit 0（卫生信息）。
      - name: gate3 cross-tree require-face diff
        if: always()  # CI-ARTIFACT-FIX：gate4 红屏不阻断 gate3 出证（gate3_ci.json 随 coqchk-logs 上传，补红态证据链缺口）
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate3_cross_tree_diff.py \
            --tree-a ConstructiveWorld_Live --tree-b ConstructiveWorld_vo \
            --json gate3_ci.json

      # 【20261105 9.3 炉 omit·gaps 登记】底本 L106-114「Sync cross-machine vo trust cache
      # (one-shot, fail-open)」步摘除：该步将对侧 mac 9.1 artifact 合流进 9.1 本地缓存树
      # （vo_sync_once.sh·SYNC_CACHE_DIR=9.1 开发树）——服务 9.1 播种链；本炉零 seed（下步）
      # 无入站需求，9.3 炉不触碰 9.1 缓存经济（防 9.3 炉写路径与 9.1 生态交叉）。

      # 本地信任缓存播种（9.3 炉·20261105 换基·改点⑥）：工具链=opam 9.3 根（job env 形 A 注入）；
      # 播种源=rocq93_work_20261101/main93 9.3 缓存树（其 .vo 同为 9.3 编译·魔数 90300）。
      # .vo 魔数 90100→90300 换代——禁播 9.1 .vo（跨代拒载全红·E835 判例同机制）。
      # 【seedLedger 判定 20261105】main93 沙箱现势：_93m_BUILD_DONE 缺席＋顶层 .vo 1013/1018
      # （缺 Arch_UpAbl_30/UpAblP2FeedSumLe/UpAblP6_Package/UpReqPadeConstUnify/_twc_probe 五件·
      # 炉在飞）→判「不可用」→首炉冷编零 seed；唯一当沙箱 BUILD_DONE 就位（R4 闸线 ≈1018＋
      # rc0·chk_main93 绿）播种自动启用——本 if 闸即 seedLedger 判定的 yml 落地形。
      - name: Seed trust cache from local vo tree
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 治本（E-STAGING-P9）：runner 侧 _work 检出目录持久非易失，
          # 旧版纯 cp 只增不改，陈旧 .vo 跨轮幸存 → coqchk digest 撕裂单件红。
          # 改为镜像删除语义：先清空再播种，保证 _work vo 树 = 播种源的真镜像。
          # （零 seed 轮本步=纯清场——9.1 并存炉在该检出树遗留的 9.1 .vo 一律先清，防跨代混装。）
          rm -f ConstructiveWorld_vo/*.vo ConstructiveWorld_vo/*.vos ConstructiveWorld_vo/*.vok 2>/dev/null || true  # 20261019 扩清 .vos/.vok 残留（叶子件 "searching for .vos" 撕裂根除）
          mkdir -p ConstructiveWorld_vo/Local
          rm -f ConstructiveWorld_vo/Local/*.vo ConstructiveWorld_vo/Local/*.vos ConstructiveWorld_vo/Local/*.vok 2>/dev/null || true
          # ── furnace93 seed（keeper4 20261105·三补丁①·先于 main93 闸）────────────────
          # 播种源=furnace93_seed 277 .vo＝run 41914865932（#3 炉@bb2a32ff）真编译幸存产物
          # （9.3 代·魔数 90300）。契约＝源指纹清单 _seed93_manifest.json（同目录）：
          # 每件录 bb2a32ff 生成时 .v sha256＋.vo sha256。只播「源未变」件——源已变件
          # 不播不豁免→指纹机全量重编（防陈旧 .vo 假绿）；有效件名册落
          # ConstructiveWorld_vo/_seed93_valid.json 供 Build 步 T2 删除律豁免
          # （无豁免则播种件无 Build 产物、被 T2 删除律全灭。20261108 注：cw_attest.json 已按
          # #9 绿树重铸（e0dacd49·9.3 代）——播种有效件若字节≠档案 digest，reconcile 判 changed
          # 送 coqchk 复验，陈种永不入跳过清单）。
          # 假绿防线不受削弱：有效件字节=清单在册 digest（步内复核）＋W3 backstop 每 20 轮
          # 全树 coqchk＋T2 对其余件照常每炉失效。
          PYTHON="C:\Program Files\Python313\python.exe"   # keeper4 20261105：显式钉真实 python（#290 商店桩坑·T2/chk 步同款）
          "$PYTHON" - <<'PYEOF93SEED'
          import json, os, hashlib, shutil
          seed_dir = r'D:/ComplexAnalysis/attn/rocq93_work_20261101/furnace93_seed'
          man_path = os.path.join(seed_dir, '_seed93_manifest.json')
          def sha(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(1 << 20), b''): h.update(b)
              return h.hexdigest()
          valid = {}
          if os.path.isfile(man_path):
              man = json.load(open(man_path, encoding='utf-8'))
              for stem, ent in man.items():
                  vf, of = os.path.join('ConstructiveWorld_vo', stem + '.v'), os.path.join(seed_dir, stem + '.vo')  # keeper6 fix: .v lives under ConstructiveWorld_vo (cwd=repo root)
                  if not os.path.isfile(vf) or not os.path.isfile(of):
                      continue
                  if sha(vf) != ent.get('v_sha256'):
                      continue  # 源已变（此头改面）→不播不豁免→指纹机重编
                  shutil.copyfile(of, os.path.join('ConstructiveWorld_vo', stem + '.vo'))
                  valid[stem] = ent.get('vo_sha256')
              print('FURNACE93-SEED: manifest=%d seeded_valid=%d' % (len(man), len(valid)))
          else:
              print('FURNACE93-SEED: manifest absent — zero 93-seed (cold path)')
          json.dump(valid, open('ConstructiveWorld_vo/_seed93_valid.json', 'w'))
          PYEOF93SEED
          if [ -f /d/ComplexAnalysis/attn/rocq93_work_20261101/main93/ConstructiveWorld_vo/_93m_BUILD_DONE ]; then
            cp /d/ComplexAnalysis/attn/rocq93_work_20261101/main93/ConstructiveWorld_vo/*.vo ConstructiveWorld_vo/ 2>/dev/null || true
            cp /d/ComplexAnalysis/attn/rocq93_work_20261101/main93/ConstructiveWorld_vo/Local/*.vo ConstructiveWorld_vo/Local/ 2>/dev/null || true
            echo "seeded from main93 (_93m_BUILD_DONE present)"
          else
            echo "ZERO-SEED: main93 sandbox not ready (_93m_BUILD_DONE absent · seedLedger verdict 20261105) — cold build; 9.1 .vo 禁播（跨代拒载）"
          fi
          echo "seeded (mirror-deleted stale) $(ls ConstructiveWorld_vo/*.vo 2>/dev/null | wc -l) .vo"


      # 20261028 内存窗卫兵（软性·report-only·零阻断）：本机与多门巨炮共用一个内存池
      # （commit 限额 ~128GB）。#301 实证：commit 水位 >89% 时 coqchk 被页出抖动拖至
      # 15.7h（清洁基线 3-5h）。本步在重相位前轮询 commit free（>30GB 即过·至多 10 分
      # 钟·不到也照常推进）——把内存水位显式化进 CI 日志·为 CHK_JOBS 调优留数据。
      # CHK_JOBS 20261105 起=14（用户提速令）：并行度加速只在内存余量充裕时有效·内存紧时越多道越抖
