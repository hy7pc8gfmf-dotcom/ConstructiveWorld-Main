          # 20261019 用户温控修法令：编译可占 4-8 核·温控包裹不减（LoadLimit 占空+TL98 照全）——
          # lane 数按授权带下沿 4 设计（mac 观察档同款）
          # 20261024 #290 PCHK-PACK-FAIL 根治：PY=${PYTHON:-python3} 在 runner bash 解析到
          # WindowsApps 商店桩（python3.exe stub：静默无输出）——显式钉真实 python。
          export PYTHON="C:\Program Files\Python313\python.exe"
          # 20261029 ATT-RECON 接线：对账步产物交 parallel_chk 免列继承件；档案指纹
          # 随附页入 _chk_all.log 留痕（gate2 认证态断言对账用）。绝对路径=parallel_chk
          # 会 cd 进 VO_DIR，相对路径即失配（att 链实证同坑）。
          export CHK_SKIP_FILE="$PWD/ConstructiveWorld_vo/_attest_skip.txt"
          # 20261108 admit restored: the 20261103 skip-withholding transition is retired
          # (archive re-cast from the #9 green tree at e0dacd49, 1021 modules) - the skip
          # list feeds parallel_chk again; the W3-BACKSTOP below still forces a full-tree
          # coqchk every 20 runs.
          export CHK_ATTEST_SHA256="$("$PYTHON" -c "import json,io;d=json.load(io.open('attest_reconcile.json',encoding='utf-8'));print(d.get('archive_tree_sha256') or 'none')" 2>/dev/null || echo none)"
          export CHK_JOBS=14   # 20261105 用户令：14 路（根分组共享闭包模式不变）
          # 20261105 Rocq 9.3 换基（形A·改点③）：parallel_chk.sh L57 K="${COQCHK:-…9.1…}" 吃本环境
          # （SW2 同根推导 COQLIB/ROCQLIB/ROCQDEP）；job env 已注入同值，此行显式重申=步级自含。
          # cw_chk93.cmd 系 coqchk_all.sh 串行壳，直挂会废并行 K=14（ci_switch README 偏离1 同判
          # ·否决）；原 cw_chk.cmd 未删，回滚=弃 job env＋本 export 即复 9.1 默认。
          export COQCHK="D:/ComplexAnalysis/attn/ocaml_work_20261101/opam-root/default/bin/coqchk.exe"
          # W3 v1.1 backstop (20261101): every 20th run withholds the skip list -> full-tree coqchk (periodic full re-certification for the incremental protocol)
          if [ $((GITHUB_RUN_NUMBER % 20)) -eq 0 ]; then : > "$PWD/ConstructiveWorld_vo/_attest_skip.txt"; echo "W3-BACKSTOP: full-tree coqchk on run $GITHUB_RUN_NUMBER (skip list withheld)"; fi
          # 20261030 装箱回退（C-path 撤除）：own-mode K=12 cost-weighted packing
          # （cost_table.json + parallel_chk v3 own branch）实测 28h+ cancelled，对照
          # K=4 基线 14h15m——每道全闭包重验物理墙，非调参可救；CHK_JOBS 回退 4，
          # own 装箱模式导出随 C-path 一并撤除。
          # 20261019 set1557：CHK_TREE_COPY=1——每 lane 独立 vo 副本（Windows 并发 coqchk mmap
          # 共载竞态对策：att1-3 三连实证同树 4 并发全灭/单发复现 CLEAN·副本断共享保并行度）
          export CHK_TREE_COPY=1
          # 20261019 活性仪表盘（假死定谳反制·用户令「环节显式表达」）：脚本内置 30s 心跳直打
          # 控制台实时日志流（各 lane checking 行数＋末模块＋rc 收割·lane 完结即时播报·宕机
          # 时刻精确到 30s）＋::group:: 四阶段折叠＋lane 失败 ::error:: 注记＋Step Summary 终表。
          # 心跳频率可调 PCHK_MON_SEC；合并日志 _chk_all.log 口径零污染（心跳只走控制台）。
          # 20261020 双实例互踩定谳（39267194332 被并发取消后 bash 进程树漏杀→僵尸实例
          # 与新轮并行互踩：僵尸 g3 22:58 被撞死·新轮 build 饿到未及自证被取消）——发射前
          # 清场：杀残存 coqchk 与 parallel_chk 壳（concurrency 组保证同刻至多一轮合法在飞）。
          taskkill //IM coqchk.exe //F 2>/dev/null || true
          powershell -NoProfile -Command "Get-CimInstance Win32_Process | Where-Object { \$_.Name -eq 'bash.exe' -and \$_.CommandLine -like '*parallel_chk*' } | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue }" || true
          # 【20261105 摘雷·gaps 响亮登记】底本 L384 悬空行 `pwsh … cpu_guard_v3.ps1 -Command`（无值）
          # 本席实测 rc=1「参数 'Command' 缺少自变量」（guard $Command=Mandatory=$true·cpu_guard_v3.ps1
          # param 块实勘）——bash -e 下必杀本步，parallel_chk 永不启动。系底本 20261105 用户令 commit
          # （3dea632 载门 60→90）编辑残留；底本零触碰不代改（9.1 炉该行归底本所有者处置），本炉摘除。
          # 载门 60→90 配套 14 路（20261105 用户令）；运行中温控防线 93C 占空/98C 硬帽不变
          pwsh -File D:/ComplexAnalysis/infra/thermal/cpu_guard_v3.ps1 -Command "bash scripts/parallel_chk.sh" -LoadLimit 90 -CoolSec 5 -MaxWaitSec 14400 -TempLimit 98 -AllowG3 -GearForce 0

      # 20261018 跨机 vo 信任缓存通道：绿后上传全树 .vo artifact，对侧
      # vo_sync_watch（scripts/vo_sync_watch.ps1 常驻计划任务）自动下载合并本地缓存，
      # 实现「一侧新增模块推送 CI、对侧自动本地化+认证」闭环。
      # 【20261105 9.3 炉改点·gaps 登记】artifact 名加 -93 后缀＝vo-trust-cache-windows-93：
      # vo_sync_once.sh:50 过滤=精确名匹配（a['name']==ARTIFACT 实测）→ 9.3 件与 9.1 通道
      # 结构性隔离（防 9.3 .vo 经 vo_sync 混入 9.1 缓存树=魔数混装）；mac 9.3 消费端候工具包
      # v1.1 波（当前无消费者·休眠无碰撞）。
      - name: Upload vo trust cache (cross-machine sync)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: vo-trust-cache-windows-93
          path: |
            ConstructiveWorld_vo/*.vo
            ConstructiveWorld_vo/Local/*.vo

      # 闸② Axioms 段哨兵：块状态机解析（禁裸 grep——裸 -i error 假配 84 行／-i axiom
      # 假配 2213 行，E422/AX-MATRIX 实证；状态机段外假匹配结构性不可能）。
      # 前置硬要求：coqchk_all.sh 已带 -o（无 Axioms 段=exit 2 不可判，一律红）。
      # exit 0 CLEAN／1 DIRTY／2 NO_AXIOMS_SECTION／3 LOG_INCOMPLETE——1/2/3 一律红（fail-loud）。
      # 代际钉：banner 必须 Chicken 9.3.0（20261105 换基·改点④；COQLIB 钉代防假红，SW2；
      # 8.3 落 9.0 陷阱免疫实证形）。
      # log 缺失≠代际失守：gate4/build 夭折时 coqchk 被 skipped、无日志可查——
      # 分支报 GATE-BANNER-ABSENT 指向上游红因（E-STAGING-R135GATE-1 连带红不指控下游域），
      # 仍 exit 1 保持红（禁降档），仅诊断文案分流。
      # 20261029 ATT-RECON 认证态分支：部分日志 + 档案覆盖断言全备 = 可判绿
      # （gate2_attest_gate.py 裁 ATTESTED_CLEAN）；断言缺一即红（禁降档）。
      # FULL 模式（跳过清单空）语义与旧版逐字节等价；parser 1/2/3（DIRTY/
      # NO_AXIOMS_SECTION/LOG_INCOMPLETE）两态一律红。banner 代际钉前置不变。
      - name: gate2 axioms sentinel (block-state-machine, fail-loud; attest branch)
        if: always()
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          if [ ! -f ConstructiveWorld_vo/_chk_all.log ]; then
            echo "GATE-BANNER-ABSENT: _chk_all.log 不在盘——coqchk 未产出日志（上游 gate4/build 夭折连带，红因看上游步），非 COQLIB 代际失守"
            exit 1
          fi
          grep -q "Welcome to Chicken 9.3.0" ConstructiveWorld_vo/_chk_all.log \
            || { echo "GATE-BANNER-FAIL: coqchk 代际非 9.3（COQLIB 钉代失守，log 不可作公理判据）"; exit 1; }
          set +e
          python scripts/gates/gate2_axioms_parser.py \
            ConstructiveWorld_vo/_chk_all.log --json gate2_verdict.json
          parser_rc=$?
          python scripts/gates/gate2_attest_gate.py \
            --log ConstructiveWorld_vo/_chk_all.log \
            --parser-json gate2_verdict.json \
            --reconcile-json attest_reconcile.json \
            --json gate2_attest.json
          gate_rc=$?
          set -e
          if [ "$gate_rc" -ne 0 ]; then
            echo "GATE2-ATTEST-RED: 认证态覆盖断言不备（gate2_attest.json reasons 列明）——red，禁降档"
            exit 1
          fi
          if [ "$parser_rc" -ne 0 ]; then
            echo "GATE2-AXIOMS-RED: parser exit $parser_rc（DIRTY/NO_AXIOMS_SECTION/LOG_INCOMPLETE 一律红）"
            exit 1
          fi
          echo "GATE2-GREEN: verdict=$(python -c "import json,io;print(json.load(io.open('gate2_attest.json',encoding='utf-8'))['verdict'])" 2>/dev/null || echo UNKNOWN)"

      - name: Upload coqchk logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coqchk-logs
          # gate4_report.json 随本件搭车出证，无独立 gate4 artifact 名——
          # 按 artifact 名清点会误判「gate4 件缺席」（CI-ARTIFACT-FIX 20260926 三包实勘在案）。
          path: |
            ConstructiveWorld_vo/_chk_*.log
            gate1_ci.json
            gate3_ci.json
            gate2_verdict.json
            gate4_report.json
            attest_reconcile.json
            gate2_attest.json

