#     `set "COQC=…9.1…"` 无条件覆写）→ build 步改直调 build.sh（build.sh L4 吃 COQC；偏离包
#     diff hunk3 的 cw_build93.cmd 路线·gaps 登记）；chk 步 parallel_chk.sh 直调照旧＋export
#     COQCHK（parallel_chk.sh L57 `${COQCHK:-…}` 形 A·包偏离1 同判：直挂 cw_chk93.cmd 串行壳
