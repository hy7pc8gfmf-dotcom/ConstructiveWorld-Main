name: Coq CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cw-main-ci
  cancel-in-progress: true

jobs:
  coq-build:
    name: Rocq 9.0 build + coqchk (self-hosted local trust cache)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 本地信任缓存播种：自托管 runner 的检出目录是全新的，
      # 从固定 vo 树复制 .vo 让 build.sh 吃指纹 SKIP（.vo 新于 .v 即跳）。
      # 工具链=本机 Rocq Platform 9.0（与该 vo 树 .vo 同源，magic 90001）。
      - name: Seed trust cache from local vo tree
        shell: bash
        run: |
          cp /d/ComplexAnalysis/ConstructiveWorld-Main/ConstructiveWorld_vo/*.vo ConstructiveWorld_vo/ 2>/dev/null || true
          echo "seeded $(ls ConstructiveWorld_vo/*.vo 2>/dev/null | wc -l) .vo"

      - name: Build full tree (order topology, fingerprint skip, thermal-guarded)
        shell: bash
        run: |
          pwsh -File D:/ComplexAnalysis/cpu_guard.ps1 -Command "cmd /c D:\actions-runner\cw_build.cmd" -LoadLimit 60 -CoolSec 5 -MaxWaitSec 7200 -CoreN 2

      - name: coqchk full-tree certification (shared-closure single pass, thermal-guarded)
        shell: bash
        run: |
          pwsh -File D:/ComplexAnalysis/cpu_guard.ps1 -Command "cmd /c D:\actions-runner\cw_chk.cmd" -LoadLimit 60 -CoolSec 5 -MaxWaitSec 7200 -CoreN 2

      - name: Upload coqchk logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coqchk-logs
          path: ConstructiveWorld_vo/_chk_*.log

      - name: Merged single-file build (retired with CW220 megafile; kept disabled for history)
        if: false
        continue-on-error: true
        run: |
          eval "$(opam env)"
          cd releases
          coqc -async-proofs off -Q . "" CW_ConstructiveWorld_220.v
