name: Coq CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cw-main-ci
  cancel-in-progress: true

jobs:
  coq-build:
    name: Rocq 9.0 build + coqchk (modular trust cache + merged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.4.14.2+options
          opam-disable-sandboxing: true

      # 信任缓存：opam switch 固定 key，恢复后 Install 秒级跳过
      - name: Cache opam switch (coq 9.0)
        uses: actions/cache@v5
        with:
          path: ~/.opam/default
          key: ${{ runner.os }}-opam-switch-rocq90

      - name: Install Rocq 9.0
        run: |
          export OPAMSANDBOXING=disabled
          eval "$(opam env)"
          opam install -y coq.9.0.0

      # 信任缓存：基座 219 产物（源码哈希 key，基座 .v 不变则秒级跳过 6MB 编译）
      - name: Cache build artifacts (base + modules, incremental)
        uses: actions/cache@v4
        with:
          path: ConstructiveWorld_vo/*.vo
          key: cw-vo-${{ hashFiles('ConstructiveWorld_Live/**/*.v', 'scripts/order.txt') }}


      - name: Build 28 modules (order.txt topology)
        run: |
          eval "$(opam env)"
          cd ConstructiveWorld_vo
          bash build.sh

      - name: coqchk full-tree certification (quiet; logs to artifact)
        run: |
          eval "$(opam env)"
          cd ConstructiveWorld_vo
          pass=0; fail=0
          for f in *.vo; do m="${f%.vo}"
            coqchk -Q . "" "$m" > "_chk_$m.log" 2>&1
            if grep -q "Modules were successfully checked" "_chk_$m.log"; then pass=$((pass+1)); echo "$m PASS"
            else fail=$((fail+1)); echo "$m FAIL"; tail -20 "_chk_$m.log"; fi
          done
          echo "coqchk summary: $pass pass / $fail fail"
          [ $fail -eq 0 ]
      - name: Upload coqchk logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coqchk-logs
          path: ConstructiveWorld_vo/_chk_*.log

      - name: Merged single-file build (long; non-fatal)
        continue-on-error: true
        run: |
          eval "$(opam env)"
          cd releases
          coqc -async-proofs off -Q . "" CW_ConstructiveWorld_220.v
