name: Coq CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cw-main-ci
  cancel-in-progress: true

jobs:
  coq-build:
    name: Rocq 9.1 build + coqchk (self-hosted local trust cache)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ── AX-FORTRESS 防线挂点（20260925 施工单，R131 落树）────────────────────
      # 闸① 毒 token 守卫：pre-build fail-fast，秒级。exit 0 洁净／1 命中／2 树无效——
      # bash -e 下非零即 step 红且后续步不启（禁红后继续）。gate1 系扁平扫描（非递归）。
      # 【R131 落树席偏离登记，候翻案】施工单原案三树（含 CW219_split），现测
      # CW219_split 在册 5×Psatz（S11-S15 壳线，09-08 分裂波遗存，HEAD 在册、零脏态），
      # 系 CW_219 消融波候 GO 施工面且不在 CI build/coqchk 认证面（cw_build/cw_chk
      # 均 cd ConstructiveWorld_vo）——硬闸常咬已知有主面=哨兵信号归零，故本波
      # gate1 只扫 Live+vo（恰=云端认证面+世系对称面）；升级方向：消融波断根后
      # CW219_split 回补第三 --tree。本地预验：Live 679/vo 700 均 0 命中。
      - name: gate1 poison-token guard (pre-build fail-fast)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate1_poison_guard.py \
            --tree ConstructiveWorld_Live --tree ConstructiveWorld_vo \
            --json gate1_ci.json --text

      # 闸④ 注释哨兵（comment hygiene hard-gate，R135 落树）：gate1 后顺位——
      # 注释面先于公理面红闸（GATE4-EXT 草案口径）。gate4_comment_guard.py v2.0：
      # 头注五字段＋基座 65 禁词＋扩展五族共 130 扫描单元＋三域全量（文件头注/
      # 证明体内/子结构头注）＋判定原则启发式（--no-principle 可作降噪开关，CI 默认开）。
      # exit 0=PASS 绿；1=硬违规红屏（五字段缺/词面硬命中/承认式/席次战役/日期戳——
      # bash -e 下同 gate1 教义，非零红且后续步不启，禁红后继续）；2=黄级（仅原则
      # 启发式复核项/语境双义词如「载体」）——artifact 收编不红屏，人工复核清单
      # 随 gate4_report.json 出。双树口径与 gate1 同款；升级方向：CW219_split
      # 消融波断根后回补第三 --tree。
      - name: gate4 comment guard (pre-build, exit1=red exit2=yellow artifact-only)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          set +e
          python scripts/gates/gate4_comment_guard.py \
            --tree ConstructiveWorld_Live --tree ConstructiveWorld_vo \
            --json gate4_report.json
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "GATE4-RED: comment-guard hard violations — see gate4_report.json artifact"
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "GATE4-YELLOW: review-only findings — artifact-collected, not red"
            exit 0
          elif [ "$rc" -eq 0 ]; then
            echo "GATE4-GREEN: all comment checks passed"
          else
            echo "GATE4-UNEXPECTED-EXIT rc=$rc — fail-loud, treat as red"
            exit 1
          fi

      # 闸③ 跨树 Require 毒面对称检查（E957 暗雷族／世系倒灌）。秒级，常开。
      # SINGLE-TREE-POISON exit 1=红；REQUIRE-DRIFT 仅登记 exit 0（卫生信息）。
      - name: gate3 cross-tree require-face diff
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          python scripts/gates/gate3_cross_tree_diff.py \
            --tree-a ConstructiveWorld_Live --tree-b ConstructiveWorld_vo \
            --json gate3_ci.json

      # 本地信任缓存播种：自托管 runner 的检出目录是全新的，
      # 从固定 vo 树复制 .vo 让 build.sh 吃指纹 SKIP（.vo 新于 .v 即跳）。
      # 工具链=本机 Rocq Platform 9.1~2026.01（与该 vo 树 .vo 同源；PROBE91 实证 201 面 9.1 全绿。
      # 原「magic 90001 / 9.0 防混装」预警随 2026-09-15 全库换装 9.1 作废——runner 侧
      # cw_build.cmd / cw_chk.cmd 的 COQC/COQCHK 须同步指向 9.1，否则 coqchk 步将对 9.1 信任缓存红）。
      - name: Seed trust cache from local vo tree
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 治本（E-STAGING-P9）：runner 侧 _work 检出目录持久非易失，
          # 旧版纯 cp 只增不改，陈旧 .vo 跨轮幸存 → coqchk digest 撕裂单件红。
          # 改为镜像删除语义：先清空再播种，保证 _work vo 树 = 本地信任缓存的真镜像。
          rm -f ConstructiveWorld_vo/*.vo 2>/dev/null || true
          cp /d/ComplexAnalysis/ConstructiveWorld-Main/ConstructiveWorld_vo/*.vo ConstructiveWorld_vo/ 2>/dev/null || true
          echo "seeded (mirror-deleted stale) $(ls ConstructiveWorld_vo/*.vo 2>/dev/null | wc -l) .vo"

      - name: Build full tree (order topology, fingerprint skip, thermal-guarded)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 温控协议已入库（仓库根 cpu_guard.ps1）：CPU 负载>LoadLimit(60%) 自动错峰冷却，绑核 CoreN 2 避免热集中。
          # repair_tear 已摘除（2026-09-19 run#85 红 run 根因，fail-loud 存档）：镜像播种语义下
          # （上一步 rm+cp 即本地信任缓存真镜像），repair_tear 的 mtime 启发式对字母序 cp 落盘
          # 时差（G→U 跨分钟，远超 v2.2 的 5s 容差）误撕 → dep-missing 级联删除 → build 按检出
          # HEAD 源重编，与本地按 M 态工作树源编译的种子 .vo 撞 digest
          # （Inconsistent assumptions over PhysPredAblation）。播种即真镜像，无需自愈；
          # 真撕裂由 coqchk 步 fail-loud 暴露、按「本地先全绿」教义本地治愈后重推。
          pwsh -File cpu_guard.ps1 -Command "cmd /c D:\actions-runner\cw_build.cmd" -LoadLimit 60 -CoolSec 5 -MaxWaitSec 7200 -CoreN 2

      # S7/PA4+PB6：全树模块计数自动化——六维计数（全树 .v／Live_X 顶层／UpAbl 顶层／
      # attn 沙箱／order 行数／提交面数）三口径分列（注册面/侧树顶层/沙箱）；
      # 论文引用口径固定=侧树顶层，防锈声明随 JSON 落盘（PB6）。
      # 前置：scripts/gen_tree_stats.ps1 须与本 patch 同波（R11x 注册波）先行入库；
      # 侧树/vo 树未挂载时该口径记 absent 不红屏（-CI record-only）；>5% fail-loud 门仅本地判。
      - name: Generate tree-stats (six-dimension counts, three-caliber breakdown)
        if: always()
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          pwsh -File scripts/gen_tree_stats.ps1 -CI -OutFile tree-stats.json
          echo "tree-stats head: $(head -c 300 tree-stats.json)"

      - name: Upload tree-stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tree-stats
          path: tree-stats.json

      - name: coqchk full-tree certification (shared-closure single pass, thermal-guarded)
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          # 温控协议（仓库根 cpu_guard.ps1）同样包裹 coqchk：负载过高时错峰，不叠加高负载任务。
          pwsh -File cpu_guard.ps1 -Command "cmd /c D:\actions-runner\cw_chk.cmd" -LoadLimit 60 -CoolSec 5 -MaxWaitSec 7200 -CoreN 2

      # 闸② Axioms 段哨兵：块状态机解析（禁裸 grep——裸 -i error 假配 84 行／-i axiom
      # 假配 2213 行，E422/AX-MATRIX 实证；状态机段外假匹配结构性不可能）。
      # 前置硬要求：coqchk_all.sh 已带 -o（无 Axioms 段=exit 2 不可判，一律红）。
      # exit 0 CLEAN／1 DIRTY／2 NO_AXIOMS_SECTION／3 LOG_INCOMPLETE——1/2/3 一律红（fail-loud）。
      # 代际钉：banner 必须 Chicken 9.1.0（COQLIB 钉代防假红，SW2；8.3 落 9.0 陷阱免疫实证形）。
      - name: gate2 axioms sentinel (block-state-machine, fail-loud)
        if: always()
        shell: C:/Progra~1/Git/bin/bash.exe -e {0}
        run: |
          grep -q "Welcome to Chicken 9.1.0" ConstructiveWorld_vo/_chk_all.log \
            || { echo "GATE-BANNER-FAIL: coqchk 代际非 9.1（COQLIB 钉代失守，log 不可作公理判据）"; exit 1; }
          python scripts/gates/gate2_axioms_parser.py \
            ConstructiveWorld_vo/_chk_all.log --json gate2_verdict.json

      - name: Upload coqchk logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coqchk-logs
          path: |
            ConstructiveWorld_vo/_chk_*.log
            gate1_ci.json
            gate3_ci.json
            gate2_verdict.json
            gate4_report.json

      - name: Merged single-file build (retired with CW220 megafile; kept disabled for history)
        if: false
        continue-on-error: true
        run: |
          eval "$(opam env)"
          cd releases
          coqc -async-proofs off -Q . "" CW_ConstructiveWorld_220.v
